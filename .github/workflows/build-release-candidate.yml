name: Build Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 .github/scripts/release.py validate | tail -n 1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          if command -v php >/dev/null 2>&1; then
            php -l src/Extension/CookieNotice.php
            php -l services/provider.php
            php -l layouts/banner.php
          else
            echo "::warning::PHP is not installed on this runner; skipping php -l."
          fi

      - name: Build deterministic Joomla package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py build --output-dir dist
          PACKAGE="dist/plg_system_cookienotice_${{ steps.meta.outputs.version }}.zip"
          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: smart-cookie-consent-v${{ steps.meta.outputs.version }}-candidate
          path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.package }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Candidate summary
        shell: bash
        run: |
          {
            echo "## Smart Cookie Consent v${{ steps.meta.outputs.version }}"
            echo
            echo "Release candidate built successfully."
            echo
            echo "**SHA-256**"
            echo '```text'
            echo "${{ steps.package.outputs.sha256 }}"
            echo '```'
            echo
            echo "Download the workflow artifact and run it through JED Checker before publishing."
          } >> "$GITHUB_STEP_SUMMARY"
